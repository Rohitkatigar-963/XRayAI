<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XrayAI - Prediction History</title>
<link rel="stylesheet" href="styles.css?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-blur"></div>

<header class="topbar">
  <div class="brand">🫁 XrayAI</div>
  <div style="display:flex;gap:12px;align-items:center;">
    <a href="index.html" class="history-nav-btn">🏠 Dashboard</a>
    <button id="themeToggle">🌙</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>Prediction History</h1>
    <p>View and manage your previous AI scans</p>
  </section>

  <section class="history-stats">
    <div class="stat glass">
        <span>Total Scans</span>
        <br>
        <strong id="totalScans">0</strong>
    </div>
    <div class="stat glass"><span>Normal</span><strong id="normalCount">0</strong></div>
    <div class="stat glass"><span>Pneumonia</span><strong id="pneumoniaCount">0</strong></div>
    <div class="stat glass"><span>COVID</span><strong id="covidCount">0</strong></div>
  </section>

  <input id="searchBox" class="history-search glass" placeholder="Search scans by image name...">

  <div id="historyContainer"></div>
</main>

<script src="history.js"></script>

<script src="theme.js"></script>
</body>
</html>
