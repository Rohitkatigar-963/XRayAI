<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>XrayAI Profile</title>

    <link rel="stylesheet"
          href="styles.css?v=2">
</head>

<body>

<div class="bg-blur"></div>

<header class="topbar">
    <div class="brand">🫁 XrayAI</div>

    <div style="display:flex;gap:15px;">
        <a href="index.html"
           class="history-nav-btn">
            🏠 Dashboard
        </a>

        <a href="history.html"
           class="history-nav-btn">
            📜 History
        </a>
        <button id="themeToggle">🌙</button>
    </div>
</header>

<main class="container">

    <div class="glass profile-card">

        <div class="profile-header">

            <div id="profileCircle" class="profile-large">
                RK
            </div>
        
            <h1 id="profileName">
                Loading...
            </h1>
        
            <p id="profileEmail">
                Loading...
            </p>
        
        </div>

        <section class="account-info glass">

            <h2>Account Information</h2>
        
            <div class="info-row">
                <span>👤 Full Name</span>
                <strong id="accountName">Loading...</strong>
            </div>
        
            <div class="info-row">
                <span>📧 Email Address</span>
                <strong id="accountEmail">Loading...</strong>
            </div>
        
            <div class="info-row">
                <span>🆔 User ID</span>
                <strong id="accountId">Loading...</strong>
            </div>
        
        </section>
        
        <div class="profile-stats">
     

            <div class="stat glass">
                <span>Total Scans</span>
                <strong id="profileScans">
                    0
                </strong>
            </div>

            <div class="stat glass">
                <span>Normal</span>
                <strong id="profileNormal">
                    0
                </strong>
            </div>

            <div class="stat glass">
                <span>Pneumonia</span>
                <strong id="profilePneumonia">
                    0
                </strong>
            </div>

            <div class="stat glass">
                <span>COVID</span>
                <strong id="profileCovid">
                    0
                </strong>
            </div>

        </div>

        <button
            id="logoutBtn"
            class="delete-btn"
        >
            🚪 Logout
        </button>

    </div>

</main>

<script src="profile.js"></script>

<script src="theme.js"></script>

</body>
</html>
